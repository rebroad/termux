name: ReBroad Termux signed APK release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERMUX_BUILD_ROOT: ${{ github.workspace }}
      TERMUX_EXEC_BUILD_DIR: ${{ github.workspace }}/termux-exec-package
      TERMUX_ALLOW_UNSIGNED_BUILD: "1"
      TERMUX_CI_TEST_KEY_SIGNING: "1"

    steps:
      - name: Check out source and pinned app fork
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android platform and NDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Prepare Termux Core headers and static library
        shell: bash
        run: |
          set -euo pipefail
          core_root="$RUNNER_TEMP/termux-core-root"
          core_prefix="$core_root/data/data/com.termux/files/usr"
          mkdir -p "$core_root"
          base_url=https://packages.termux.dev/apt/termux-main/pool/main/t

          # These pinned files match termux-core 0.4.0-1 from the signed Termux index.
          for package in termux-core termux-core-static; do
            deb="$RUNNER_TEMP/$package.deb"
            url="$base_url/$package/${package}_0.4.0-1_aarch64.deb"
            curl --fail --location --silent --show-error "$url" --output "$deb"
            case "$package" in
              termux-core)
                expected_sha256=4f809d70eff0afa8c1beccbf4b5f65e0f59207867462a3a2f66b3e2fcd64b057
                ;;
              termux-core-static)
                expected_sha256=3494123a066b38ea7e14f1f217cf8aaffaea74e8d87abb9f70b76ee27ae1e019
                ;;
            esac
            printf '%s  %s\n' "$expected_sha256" "$deb" | sha256sum --check --status
            dpkg-deb --extract "$deb" "$core_root"
          done

          test -d "$core_prefix/include/termux-core/termux/termux_core__nos__c"
          test -f "$core_prefix/lib/libtermux-core_nos_c_tre.a"

      - name: Build customized Termux exec for arm64
        shell: bash
        run: |
          set -euo pipefail
          ndk_root="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          make -C termux-exec-package \
            TERMUX_EXEC_PKG__ARCH=aarch64 \
            TERMUX_CORE_PKG__INSTALL_PREFIX="$RUNNER_TEMP/termux-core-root/data/data/com.termux/files/usr" \
            CC="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Build unsigned release APK
        run: ./scripts/build-termux.sh

      - name: Check signed APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          apk=termux-app/app/build/outputs/apk/release/termux-app_apt-android-7-release_universal.apk
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/termux-app-0.118.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/termux-app-0.118.0.apk
          (cd dist && sha256sum termux-app-0.118.0.apk > SHA256SUMS.txt)

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-0.118.0
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="rebroad-0.118.0-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/termux-app-0.118.0.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ReBroad Termux 0.118.0 (test signed)" \
            --notes "Universal Android APK using original Termux versionName 0.118.0 and versionCode 118. Uses the publicly available untrusted Termux test signing key, not a private release key. Back up existing installations before switching signing sources." \
            --prerelease
